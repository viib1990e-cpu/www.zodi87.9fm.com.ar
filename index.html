<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ZODI 87.9 FM - En Vivo</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Roboto', sans-serif;
    }

    body {
      background-color: #121212;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .phone-container {
      width: 100%;
      max-width: 414px;
      height: 100vh;
      max-height: 896px;
      background-color: #ffffff;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    /* --- SECCIÓN SUPERIOR: REPRODUCTOR LIMPIO --- */
    .stream-screen {
      position: relative;
      height: 34%;
      min-height: 250px;
      background-color: #050505;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      border-bottom: 3px solid #ff0033;
      overflow: hidden;
    }

    .yt-wrapper {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 155%;
      height: 155%;
      transform: translate(-50%, -50%);
      z-index: 0;
      opacity: 0;
      transition: opacity 0.6s ease;
      pointer-events: none;
    }

    .yt-wrapper.ready {
      opacity: 1;
    }

    .yt-wrapper iframe {
      width: 100%;
      height: 100%;
      border: 0;
      filter: brightness(0.88);
    }

    .stream-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(0, 0, 0, 0.55) 0%,
        rgba(0, 0, 0, 0.05) 50%,
        rgba(0, 0, 0, 0.65) 100%
      );
      z-index: 1;
      pointer-events: none;
    }

    .station-logo-corner {
      position: absolute;
      top: 13px;
      left: 14px;
      z-index: 3;
      text-align: left;
      user-select: none;
      pointer-events: none;
    }

    .station-name {
      font-size: 17px;
      font-weight: 900;
      letter-spacing: -0.3px;
      line-height: 0.95;
      color: #ffffff;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.9);
    }

    .station-freq {
      font-size: 8.5px;
      font-weight: 700;
      color: #ff2a2a;
      margin-top: 1.5px;
      letter-spacing: 0.4px;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.95);
    }

    .live-badge-container {
      position: absolute;
      top: 13px;
      right: 14px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      z-index: 3;
    }

    .live-badge {
      background-color: #e60000;
      color: white;
      font-size: 10.5px;
      font-weight: 700;
      padding: 2.5px 6.5px;
      border-radius: 3px;
      letter-spacing: 0.5px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.4);
    }

    .location-text {
      font-size: 9.5px;
      color: #f0f0f0;
      margin-top: 2px;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    }

    .stream-footer-info {
      position: absolute;
      bottom: 12px;
      left: 14px;
      right: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      font-size: 12.5px;
      font-weight: 700;
      z-index: 3;
    }

    .weather {
      display: flex;
      align-items: center;
      gap: 5px;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(4px);
      padding: 3.5px 9px;
      border-radius: 12px;
      max-width: 56%;
      overflow: hidden;
      white-space: nowrap;
      transition: opacity 0.3s ease;
    }

    #weather-province {
      color: #e0e0e0;
      font-weight: 500;
      font-size: 11.5px;
      text-overflow: ellipsis;
      overflow: hidden;
    }

    #weather-temp {
      color: #ffffff;
      font-weight: 700;
      font-size: 12px;
    }

    .right-controls {
      display: flex;
      align-items: center;
      gap: 7px;
      flex-shrink: 0;
    }

    .radio-play-btn {
      background: rgba(15, 15, 15, 0.68);
      backdrop-filter: blur(4px);
      color: #ffffff;
      border: 1px solid rgba(255, 58, 58, 0.65);
      border-radius: 12px;
      padding: 3px 8px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.2px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
      transition: background-color 0.2s ease, border-color 0.2s ease, transform 0.1s ease;
    }

    .radio-play-btn #radio-play-icon {
      color: #ff3a3a;
      font-size: 8.5px;
      line-height: 1;
    }

    .radio-play-btn.playing {
      background: rgba(230, 0, 0, 0.22);
      border-color: rgba(255, 255, 255, 0.35);
    }

    .radio-play-btn.playing #radio-play-icon {
      color: #ffffff;
    }

    .radio-play-btn:active {
      transform: scale(0.94);
    }

    #clock {
      text-shadow: 0 1px 4px rgba(0,0,0,0.85);
      font-size: 12.5px;
    }

    /* --- SECCIÓN INFERIOR: CHAT EN VIVO --- */
    .chat-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      background-color: #ffffff;
      border-top-left-radius: 14px;
      border-top-right-radius: 14px;
      margin-top: -8px;
      z-index: 4;
      overflow: hidden;
    }

    .chat-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      border-bottom: 1px solid #ececec;
    }

    .chat-title-group h2 {
      font-size: 18px;
      font-weight: 700;
      color: #0f0f0f;
    }

    .chat-subtitle {
      font-size: 12px;
      color: #606060;
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 2px;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .message-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      font-size: 14px;
      line-height: 1.35;
      animation: fadeIn 0.25s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      color: white;
      font-size: 12px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 1px;
      object-fit: cover;
      background-color: #607d8b;
    }

    .message-content {
      color: #0f0f0f;
      word-break: break-word;
    }

    .username {
      color: #606060;
      font-weight: 500;
      margin-right: 6px;
    }

    .welcome-wrapper {
      position: relative;
      padding: 0 12px 8px 12px;
    }

    .welcome-box {
      background-color: #f2f2f2;
      border-radius: 10px;
      padding: 10px 45px 10px 12px;
      font-size: 12px;
      color: #333333;
      line-height: 1.4;
    }

    .welcome-box a {
      color: #065fd4;
      text-decoration: none;
      font-weight: 500;
    }

    .heart-btn {
      position: absolute;
      right: 16px;
      top: -12px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background-color: #ffffff;
      border: 1px solid #e5e5e5;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.1s;
    }

    .heart-btn:active {
      transform: scale(0.9);
    }

    .chat-input-area {
      padding: 8px 12px 14px 12px;
      border-top: 1px solid #ececec;
      display: flex;
      align-items: center;
      gap: 10px;
      background-color: #ffffff;
    }

    .user-profile-trigger {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1.5px solid #d0d0d0;
      overflow: hidden;
      cursor: pointer;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #f2f2f2;
      color: #555;
      font-weight: 700;
      font-size: 13px;
    }

    .user-profile-trigger img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .input-pill {
      flex: 1;
      background-color: #f2f2f2;
      border-radius: 20px;
      display: flex;
      align-items: center;
      padding: 8px 14px;
    }

    .input-pill input {
      flex: 1;
      border: none;
      background: transparent;
      outline: none;
      font-size: 14px;
      color: #0f0f0f;
    }

    .send-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: #065fd4;
      font-weight: 700;
      font-size: 14px;
      padding-left: 6px;
    }

    /* --- MODAL DE PERFIL --- */
    .profile-modal {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 50;
      padding: 20px;
    }

    .profile-modal.active {
      display: flex;
    }

    .profile-card {
      background: #ffffff;
      width: 100%;
      max-width: 320px;
      border-radius: 16px;
      padding: 22px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }

    .profile-card h3 {
      font-size: 18px;
      margin-bottom: 16px;
      color: #0f0f0f;
    }

    .photo-picker {
      position: relative;
      width: 86px;
      height: 86px;
      margin: 0 auto 16px auto;
      border-radius: 50%;
      background: #f0f0f0;
      border: 2px dashed #bbb;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      overflow: hidden;
    }

    .photo-picker img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .photo-picker span {
      font-size: 11px;
      color: #666;
      padding: 4px;
    }

    .profile-card input[type="text"] {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 14px;
      margin-bottom: 16px;
      outline: none;
    }

    .profile-actions {
      display: flex;
      gap: 10px;
    }

    .btn-save {
      flex: 1;
      background: #ff0033;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-cancel {
      background: #eee;
      color: #333;
      border: none;
      padding: 10px 14px;
      border-radius: 10px;
      font-weight: 500;
      cursor: pointer;
    }

    .floating-heart {
      position: absolute;
      right: 28px;
      bottom: 70px;
      font-size: 22px;
      pointer-events: none;
      animation: floatUp 1.5s ease-out forwards;
      z-index: 10;
    }

    @keyframes floatUp {
      0% { transform: translateY(0) scale(0.8); opacity: 1; }
      100% { transform: translateY(-140px) scale(1.3); opacity: 0; }
    }
  </style>
</head>
<body>

  <div class="phone-container">
    <!-- PANTALLA DE TRANSMISIÓN -->
    <div class="stream-screen" id="stream-screen">
      <div class="yt-wrapper" id="yt-wrapper">
        <div id="yt-player"></div>
      </div>

      <div class="stream-overlay"></div>

      <div class="station-logo-corner">
        <div class="station-name">ZODI</div>
        <div class="station-freq">87.9 FM</div>
      </div>

      <div class="live-badge-container">
        <span class="live-badge">EN VIVO</span>
        <span class="location-text">Gualeguaychú</span>
      </div>

      <div class="stream-footer-info">
        <div class="weather" id="weather-box">
          <span id="weather-icon">⛅</span>
          <span id="weather-province">Cargando clima...</span>
          <span id="weather-temp"></span>
        </div>

        <div class="right-controls">
          <button type="button" class="radio-play-btn" id="radio-play-btn" title="Reproducir o pausar radio">
            <span id="radio-play-icon">▶</span>
            <span id="radio-play-text">Play</span>
          </button>
          <div id="clock">00:00</div>
        </div>
      </div>

      <audio id="radio-stream" preload="none" playsinline>
        <source src="https://uk14freenew.listen2myradio.com/live.mp3?typeportmount=s1_35404_stream_711093753" type="audio/mpeg">
      </audio>
    </div>

    <!-- SECCIÓN DE CHAT EN VIVO -->
    <div class="chat-section">
      <div class="chat-header">
        <div class="chat-title-group">
          <h2>Chat en vivo</h2>
          <div class="chat-subtitle">
            <span>Mensajes pri...ales</span>
            <span>👤 <span id="viewer-count">0</span></span>
          </div>
        </div>
      </div>

      <div class="chat-messages" id="chat-box"></div>

      <div class="welcome-wrapper" id="welcome-area">
        <div class="welcome-box">
          ¡Te damos la bienvenida al chat en vivo! Recuerda proteger tu privacidad y satisfacer nuestros Lineamientos de la Comunidad. <a href="#">Más información</a>
        </div>
        <button class="heart-btn" id="like-btn" title="Enviar reacción">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="#ff2a2a">
            <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
          </svg>
        </button>
      </div>

      <form class="chat-input-area" id="chat-form">
        <div class="user-profile-trigger" id="avatar-trigger" title="Cambiar foto y nombre">
          📷
        </div>
        <div class="input-pill">
          <input type="text" id="message-input" placeholder="Chat..." autocomplete="off">
          <button type="submit" class="send-btn">➤</button>
        </div>
      </form>
    </div>

    <!-- MODAL PARA ELEGIR NOMBRE Y FOTO DE GALERÍA -->
    <div class="profile-modal" id="profile-modal">
      <div class="profile-card">
        <h3>Tu perfil en el chat</h3>
        
        <label class="photo-picker" for="gallery-input">
          <img id="preview-photo" style="display:none;" alt="Foto">
          <span id="photo-placeholder">Elegir foto de galería</span>
        </label>
        <input type="file" id="gallery-input" accept="image/*" style="display:none;">

        <input type="text" id="username-input" placeholder="Escribe tu nombre..." maxlength="25">

        <div class="profile-actions">
          <button type="button" class="btn-cancel" id="close-modal">Cancelar</button>
          <button type="button" class="btn-save" id="save-profile">Guardar</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Blindaje ante errores externos -->
  <script>
    window.addEventListener("error", function (event) {
      if (event && typeof event.message === "string" && event.message.includes("span_")) {
        event.preventDefault();
        return true;
      }
    });
  </script>

  <!-- API de YouTube -->
  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    let player;
    const ytWrapper = document.getElementById('yt-wrapper');

    function onYouTubeIframeAPIReady() {
      try {
        player = new YT.Player('yt-player', {
          videoId: 'sJBDRvQBXYI',
          playerVars: {
            autoplay: 1,
            mute: 1,
            controls: 0,
            disablekb: 1,
            fs: 0,
            iv_load_policy: 3,
            modestbranding: 1,
            playsinline: 1,
            rel: 0
          },
          events: {
            onReady: function(event) {
              event.target.mute();
              event.target.playVideo();
            },
            onStateChange: function(event) {
              if (event.data === YT.PlayerState.PLAYING) {
                setTimeout(() => {
                  ytWrapper.classList.add('ready');
                }, 600);
              }
            }
          }
        });
      } catch (_) {}
    }

    /* ==========================================================
       0.5 BOTÓN DE PLAY / PAUSA DE LA RADIO EN VIVO
       ========================================================== */
    const radioStream = document.getElementById('radio-stream');
    const radioPlayBtn = document.getElementById('radio-play-btn');
    const radioPlayIcon = document.getElementById('radio-play-icon');
    const radioPlayText = document.getElementById('radio-play-text');
    const streamUrl = "https://uk14freenew.listen2myradio.com/live.mp3?typeportmount=s1_35404_stream_711093753";
    let isPlayingRadio = false;

    function actualizarBotonRadio(reproduciendo, textoExtra = null) {
      isPlayingRadio = reproduciendo;
      if (reproduciendo) {
        radioPlayBtn.classList.add('playing');
        radioPlayIcon.textContent = '❚❚';
        radioPlayText.textContent = textoExtra || 'Pausar';
      } else {
        radioPlayBtn.classList.remove('playing');
        radioPlayIcon.textContent = '▶';
        radioPlayText.textContent = textoExtra || 'Play';
      }
    }

    radioPlayBtn.addEventListener('click', () => {
      if (!isPlayingRadio) {
        actualizarBotonRadio(false, 'Cargando...');
        radioStream.src = streamUrl;
        radioStream.muted = false;
        radioStream.volume = 1;
        radioStream.load();
        radioStream.play().then(() => {
          actualizarBotonRadio(true, 'Pausar');
        }).catch(() => {
          actualizarBotonRadio(false, 'Play');
        });
      } else {
        radioStream.pause();
        radioStream.src = '';
        actualizarBotonRadio(false, 'Play');
      }
    });

    radioStream.addEventListener('playing', () => actualizarBotonRadio(true, 'Pausar'));
    radioStream.addEventListener('waiting', () => {
      if (isPlayingRadio) radioPlayText.textContent = 'Cargando...';
    });
    radioStream.addEventListener('error', () => actualizarBotonRadio(false, 'Play'));

    /* ==========================================================
       1. CLIMA REAL DE TODAS LAS PROVINCIAS DE ARGENTINA
       ========================================================== */
    const provincias = [
      { nombre: "Entre Ríos", lat: -33.0094, lon: -58.5172 },
      { nombre: "Buenos Aires", lat: -34.9214, lon: -57.9544 },
      { nombre: "CABA", lat: -34.6037, lon: -58.3816 },
      { nombre: "Catamarca", lat: -28.4696, lon: -65.7852 },
      { nombre: "Chaco", lat: -27.4514, lon: -58.9867 },
      { nombre: "Chubut", lat: -43.3002, lon: -65.1023 },
      { nombre: "Córdoba", lat: -31.4201, lon: -64.1888 },
      { nombre: "Corrientes", lat: -27.4692, lon: -58.8306 },
      { nombre: "Formosa", lat: -26.1849, lon: -58.1731 },
      { nombre: "Jujuy", lat: -24.1858, lon: -65.2995 },
      { nombre: "La Pampa", lat: -36.6167, lon: -64.2833 },
      { nombre: "La Rioja", lat: -29.4131, lon: -66.8558 },
      { nombre: "Mendoza", lat: -32.8895, lon: -68.8458 },
      { nombre: "Misiones", lat: -27.3671, lon: -55.8961 },
      { nombre: "Neuquén", lat: -38.9516, lon: -68.0591 },
      { nombre: "Río Negro", lat: -40.8135, lon: -62.9967 },
      { nombre: "Salta", lat: -24.7821, lon: -65.4232 },
      { nombre: "San Juan", lat: -31.5375, lon: -68.5364 },
      { nombre: "San Luis", lat: -33.3017, lon: -66.3378 },
      { nombre: "Santa Cruz", lat: -51.6226, lon: -69.2181 },
      { nombre: "Santa Fe", lat: -31.6333, lon: -60.7000 },
      { nombre: "Santiago del Estero", lat: -27.7951, lon: -64.2615 },
      { nombre: "Tierra del Fuego", lat: -54.8019, lon: -68.3030 },
      { nombre: "Tucumán", lat: -26.8083, lon: -65.2176 }
    ];

    let datosClima = [];
    let indiceProvincia = 0;

    function obtenerIconoClima(code) {
      if (code === 0) return "☀️";
      if (code <= 3) return "⛅";
      if (code <= 48) return "🌫️";
      if (code <= 67) return "🌧️";
      if (code <= 77) return "❄️";
      if (code <= 82) return "🌦️";
      return "⛈️";
    }

    async function cargarClimaProvincias() {
      try {
        const lats = provincias.map(p => p.lat).join(",");
        const lons = provincias.map(p => p.lon).join(",");
        const url = `https://api.open-meteo.com/v1/forecast?latitude=${lats}&longitude=${lons}&current_weather=true`;
        
        const res = await fetch(url);
        const data = await res.json();

        datosClima = provincias.map((prov, i) => ({
          nombre: prov.nombre,
          temp: Math.round(data[i].current_weather.temperature * 10) / 10 + "°",
          icono: obtenerIconoClima(data[i].current_weather.weathercode)
        }));

        mostrarSiguienteProvincia();
      } catch (error) {
        document.getElementById('weather-province').textContent = "Entre Ríos";
        document.getElementById('weather-temp').textContent = "24.1°";
      }
    }

    function mostrarSiguienteProvincia() {
      if (datosClima.length === 0) return;
      const actual = datosClima[indiceProvincia];
      const box = document.getElementById('weather-box');
      
      box.style.opacity = 0;
      setTimeout(() => {
        document.getElementById('weather-icon').textContent = actual.icono;
        document.getElementById('weather-province').textContent = actual.nombre;
        document.getElementById('weather-temp').textContent = actual.temp;
        box.style.opacity = 1;
      }, 250);

      indiceProvincia = (indiceProvincia + 1) % datosClima.length;
    }

    cargarClimaProvincias();
    setInterval(mostrarSiguienteProvincia, 4000);
    setInterval(cargarClimaProvincias, 600000);

    /* ==========================================================
       2. PERFIL DE USUARIO (NOMBRE + FOTO DE GALERÍA)
       ========================================================== */
    let userProfile = { name: '', photo: '' };
    try {
      userProfile = JSON.parse(localStorage.getItem('zodi_user_profile')) || { name: '', photo: '' };
    } catch (_) {}
    let tempPhoto = userProfile.photo;

    const modal = document.getElementById('profile-modal');
    const avatarTrigger = document.getElementById('avatar-trigger');
    const galleryInput = document.getElementById('gallery-input');
    const previewPhoto = document.getElementById('preview-photo');
    const photoPlaceholder = document.getElementById('photo-placeholder');
    const usernameInput = document.getElementById('username-input');

    function actualizarAvatarUI() {
      if (userProfile.photo) {
        avatarTrigger.innerHTML = `<img src="${userProfile.photo}" alt="Perfil">`;
      } else if (userProfile.name) {
        avatarTrigger.textContent = userProfile.name.charAt(0).toUpperCase();
      } else {
        avatarTrigger.textContent = '📷';
      }
    }

    function abrirModalPerfil() {
      usernameInput.value = userProfile.name;
      tempPhoto = userProfile.photo;
      if (tempPhoto) {
        previewPhoto.src = tempPhoto;
        previewPhoto.style.display = 'block';
        photoPlaceholder.style.display = 'none';
      } else {
        previewPhoto.style.display = 'none';
        photoPlaceholder.style.display = 'block';
      }
      modal.classList.add('active');
    }

    avatarTrigger.addEventListener('click', abrirModalPerfil);
    document.getElementById('close-modal').addEventListener('click', () => modal.classList.remove('active'));

    galleryInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(event) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          const size = 96;
          canvas.width = size;
          canvas.height = size;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, size, size);
          tempPhoto = canvas.toDataURL('image/jpeg', 0.65);
          
          previewPhoto.src = tempPhoto;
          previewPhoto.style.display = 'block';
          photoPlaceholder.style.display = 'none';
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });

    document.getElementById('save-profile').addEventListener('click', () => {
      const nombre = usernameInput.value.trim();
      if (!nombre) {
        alert("Por favor escribe tu nombre.");
        return;
      }
      userProfile = { name: nombre, photo: tempPhoto };
      try {
        localStorage.setItem('zodi_user_profile', JSON.stringify(userProfile));
      } catch (_) {}
      if (typeof window.actualizarPresenciaUsuario === "function") {
        window.actualizarPresenciaUsuario(userProfile.name);
      }
      actualizarAvatarUI();
      modal.classList.remove('active');
    });

    actualizarAvatarUI();

    /* ==========================================================
       3. UI DEL CHAT Y RELOJ
       ========================================================== */
    const chatBox = document.getElementById('chat-box');
    const chatForm = document.getElementById('chat-form');
    const messageInput = document.getElementById('message-input');
    const likeBtn = document.getElementById('like-btn');
    const welcomeArea = document.getElementById('welcome-area');
    const viewerCount = document.getElementById('viewer-count');
    const mensajesRenderizados = new Set();

    window.actualizarContadorConectados = function(cantidad) {
      viewerCount.textContent = Math.max(0, Number(cantidad) || 0);
    };

    window.renderMessage = function(msg, msgId = null) {
      if (msgId && mensajesRenderizados.has(msgId)) return;
      if (msgId) mensajesRenderizados.add(msgId);

      const item = document.createElement('div');
      item.className = 'message-item';

      const safeUser = String(msg.user || 'Oyente').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      const safeText = String(msg.text || '').replace(/</g, '&lt;').replace(/>/g, '&gt;');

      const avatarHTML = msg.photo
        ? `<img src="${msg.photo}" class="avatar" alt="${safeUser}">`
        : `<div class="avatar">${safeUser.charAt(0).toUpperCase()}</div>`;

      item.innerHTML = `
        ${avatarHTML}
        <div class="message-content">
          <span class="username">@${safeUser}</span>${safeText}
        </div>
      `;
      chatBox.appendChild(item);
      chatBox.scrollTop = chatBox.scrollHeight;
    };

    likeBtn.addEventListener('click', () => {
      const heart = document.createElement('div');
      heart.className = 'floating-heart';
      heart.textContent = '❤️';
      welcomeArea.appendChild(heart);
      setTimeout(() => heart.remove(), 1500);
    });

    function updateClock() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      document.getElementById('clock').textContent = `${hours}:${minutes}`;
    }
    setInterval(updateClock, 1000);
    updateClock();
  </script>

      const db = getDatabase(app);

      chatForm.addEventListener("submit", async (e) => {

        const text = messageInput.value.trim();
        if (!text) return;

        const photoToSend = (userProfile.photo && userProfile.photo.length < 45000)
          ? userProfile.photo
          : "";

        const nuevoMensaje = {
          user: userProfile.name,
          photo: photoToSend,
          text: text,
          timestamp: Date.now()
        };

        messageInput.value = "";

        try {
          await push(allMessagesRef, nuevoMensaje);
        } catch (err) {
          window.renderMessage(nuevoMensaje);

      // Contador de personas en tiempo real: suma al entrar y resta al salir
      const sessionId = "sess_" + Date.now() + "_" + Math.random().toString(36).slice(2, 8);
      const myPresenceRef = ref(db, `zodi_chat/presence/${sessionId}`);
      const connectedRef = ref(db, ".info/connected");
      let estaConectado = false;

      function registrarEntrada() {
        return set(myPresenceRef, {
          name: userProfile.name || "Oyente",
          onlineAt: Date.now()

      window.actualizarPresenciaUsuario = function(nuevoNombre) {

          set(myPresenceRef, {

            onlineAt: Date.now()
          }).catch(() => {});
        }
      };

      onValue(connectedRef, (snap) => {
        estaConectado = snap.val() === true;
        if (estaConectado) {
          onDisconnect(myPresenceRef).remove().then(() => {
            registrarEntrada().catch(() => {});
          }).catch(() => {
            registrarEntrada().catch(() => {});
          });
        }
      });

      function salirDeSala() {
        remove(myPresenceRef).catch(() => {});
      }

      window.addEventListener("pagehide", salirDeSala);
      window.addEventListener("beforeunload", salirDeSala);

      onValue(presenceRef, (snap) => {
